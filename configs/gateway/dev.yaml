# 网关服务特定配置 (dev 环境)

server:
  host: "172.29.16.1"
  port: 10000 # 覆盖共享配置中的端口

gateway:
  route_rules:
    - service_name: "user-svc"
      path_prefix: "/api/users"
      strip_prefix: true
    - service_name: "order-svc"
      path_prefix: "/api/orders"
      strip_prefix: true
  
  auth:
    enable: true
    scheme: "Bearer"
    client_id: "gateway-client"
    client_secret: "gateway-secret"
    skip_paths:
      - "/api/auth/token"
      - "/health"

  rate_limit:
    default_rate: 100
    default_burst: 200
  proxy:
    connect_timeout: 5s
    response_header_timeout: 30s
    max_idle_conns: 100
    max_idle_conns_per_host: 20
    max_conns_per_host: 0 # 0 = unlimited
    idle_conn_timeout: 90s
    tls_handshake_timeout: 10s
    expect_continue_timeout: 1s
    max_retries: 2 # idempotent requests only
    retry_backoff: 100ms
  metrics:
    sample_rate: 0.1
    upstream_sample_rate: 1.0

