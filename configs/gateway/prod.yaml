server:
  host: "0.0.0.0"
  port: 10001
store_type: consul
consul:
  host: "localhost:8500"
  key_path: easyms/share/%s.yaml,%s/%s
  reload_on_changes: true
database:
  host: "localhost"
  port: 3306
  user: "root"
  password: "password"
rate_limit:
  ip_limits:
    - cidr: "192.168.1.0/24"
      rate: 20
      burst: 40
    - cidr: "10.0.0.0/8"
      rate: 5
      burst: 10
  ua_limits:
    - pattern: ".*Chrome.*"
      rate: 50
      burst: 100
    - pattern: ".*curl.*"
      rate: 2
      burst: 5
  default_rate: 100
  default_burst: 200