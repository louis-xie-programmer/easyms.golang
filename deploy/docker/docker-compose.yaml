version: '3.8'

networks:
  easy-network:
    driver: bridge

services:
  consul:
    image: consul:1.15.4
    container_name: consul
    volumes:
      - ./consul/data:/consul/data
    command: consul agent -server -datacenter=easy -ui -client=0.0.0.0 -bind=0.0.0.0 -node=node1 -bootstrap-expect=1 -data-dir=/consul/data
    ports:
      - "8500:8500"
      - "8600:8600/tcp"
      - "8600:8600/udp"
      - "8300:8300"
      - "8301:8301/tcp"
      - "8301:8301/udp"
      - "8302:8302/tcp"
      - "8302:8302/udp"
    networks:
      - easy-network
    environment:
      - CONSUL_ALLOW_PRIVILEGED_PORTS=

  loki:
    image: grafana/loki:2.9.4
    container_name: loki
    ports:
      - "3100:3100"
    networks:
      - easy-network
    volumes:
      - loki_data:/etc/loki
    command:
      - "-config.expand-env"
      - "-config.file=/etc/loki/local-config.yaml"
    environment:
      - LOKI_USERNAME=easy
      - LOKI_PASSWORD=easyms

  grafana:
    image: grafana/grafana:10.3.1
    container_name: grafana
    ports:
      - "3000:3000"
    networks:
      - easy-network
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - loki

  promtail:
    image: grafana/promtail:2.9.4
    container_name: promtail
    volumes:
      - ./promtail/config.yaml:/etc/promtail/config.yaml
      - ./promtail/log:/var/log
    command:
      - "-config.expand-env"
      - "-config.file=/etc/promtail/config.yaml"
    networks:
      - easy-network
    depends_on:
      - loki

volumes:
  loki_data:
  grafana_data: