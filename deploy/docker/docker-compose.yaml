version: '3.8'

networks:
  easy-network:
    driver: bridge

services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"   # AMQP port for services
      - "15672:15672" # Management UI
    networks:
      - easy-network
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-svc:
    container_name: auth-svc
    build:
      context: ../../
      dockerfile: ./internal/services/auth/cmd/Dockerfile
    networks:
      - easy-network
    environment:
      - POSTGRES_DSN=postgres://easy:easypass@easy-db:5432/easydb?sslmode=disable
      - CONSUL_ADDR=consul:8500
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - EASYMS_TRACING_ENABLE=true
      - EASYMS_TRACING_ENDPOINT=http://jaeger:14268/api/traces
    depends_on:
      - easy-db
      - consul
      - rabbitmq
      - jaeger

  user-svc:
    container_name: user-svc
    build:
      context: ../../
      dockerfile: ./internal/services/user/cmd/Dockerfile
    networks:
      - easy-network
    environment:
      - POSTGRES_DSN=postgres://easy:easypass@easy-db:5432/easydb?sslmode=disable
      - CONSUL_ADDR=consul:8500
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - EASYMS_TRACING_ENABLE=true
      - EASYMS_TRACING_ENDPOINT=http://jaeger:14268/api/traces
    depends_on:
      - easy-db
      - consul
      - rabbitmq
      - jaeger

  api-gateway:
    container_name: api-gateway
    build:
      context: ../../
      dockerfile: ./internal/platform/gateway/Dockerfile
    networks:
      - easy-network
    environment:
      - CONSUL_ADDR=consul:8500
      - EASYMS_TRACING_ENABLE=true
      - EASYMS_TRACING_ENDPOINT=http://jaeger:14268/api/traces
    ports:
      - "10000:10000"
    depends_on:
      - consul
      - user-svc
      - auth-svc
      - jaeger

  consul:
    image: consul:1.15.4
    container_name: consul
    volumes:
      - ./consul/data:/consul/data
    command: consul agent -server -datacenter=easy -ui -client=0.0.0.0 -bind=0.0.0.0 -node=node1 -bootstrap-expect=1 -data-dir=/consul/data
    ports:
      - "8500:8500"
      - "8600:8600/tcp"
      - "8600:8600/udp"
      - "8300:8300"
      - "8301:8301/tcp"
      - "8301:8301/udp"
      - "8302:8302/tcp"
      - "8302:8302/udp"
    networks:
      - easy-network
    environment:
      - CONSUL_ALLOW_PRIVILEGED_PORTS=

  easy-db:
    image: postgres:18.1
    container_name: easy-db
    ports:
      - "5432:5432"
    networks:
      - easy-network
    environment:
      - POSTGRES_USER=easy
      - POSTGRES_PASSWORD=easypass
      - POSTGRES_DB=easydb
      - PGDATA=/var/lib/postgresql/data
    volumes:
      - ./postgres/data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - easy-network
    command: redis-server --appendonly yes --requirepass easymspass

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    ports:
      - "16686:16686" # Jaeger UI
      - "14268:14268" # OTLP HTTP Collector
      - "4317:4317"
      - "4318:4318"
    networks:
      - easy-network
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  loki:
    image: grafana/loki:2.9.4
    container_name: loki
    ports:
      - "3100:3100"
    networks:
      - easy-network
    volumes:
      - loki_data:/etc/loki
    command:
      - "-config.expand-env"
      - "-config.file=/etc/loki/local-config.yaml"
    environment:
      - LOKI_USERNAME=easy
      - LOKI_PASSWORD=easyms

  grafana:
    image: grafana/grafana:10.3.1
    container_name: grafana
    ports:
      - "3000:3000"
    networks:
      - easy-network
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - loki

  promtail:
    image: grafana/promtail:2.9.4
    container_name: promtail
    volumes:
      - ./promtail/config.yaml:/etc/promtail/config.yaml
      - ./promtail/log:/var/log
    command:
      - "-config.expand-env"
      - "-config.file=/etc/promtail/config.yaml"
    networks:
      - easy-network
    depends_on:
      - loki

volumes:
  loki_data:
  grafana_data:
