version: '3.8'

networks:
  easy-network:
    driver: bridge

services:
  auth-svc:
    container_name: auth-svc
    build:
      context: ../../
      dockerfile: ./cmd/auth-svc/Dockerfile
    environment:
      POSTGRES_DSN: postgres://easy:easypass@easy-db:5432/easydb?sslmode=disable
      CONSUL_ADDR: consul:8500
    depends_on:
      - easy-db
      - consul

  user-svc:
    container_name: user-svc
    build:
      context: ../../
      dockerfile: ./cmd/user-svc/Dockerfile
    environment:
      POSTGRES_DSN: postgres://easy:easypass@easy-db:5432/easydb?sslmode=disable
      CONSUL_ADDR: consul:8500
    depends_on:
      - easy-db
      - consul

  api-gateway:
    container_name: api-gateway
    build:
      context: ../../
      dockerfile: ./cmd/api-gateway/Dockerfile
    environment:
      CONSUL_ADDR: consul:8500
    ports:
      - "10000:10000"
    depends_on:
      - consul
      - user-svc
      - auth-svc

  consul:
    image: consul:1.15.4
    container_name: consul
    volumes:
      - ./consul/data:/consul/data
    command: consul agent -server -datacenter=easy -ui -client=0.0.0.0 -bind=0.0.0.0 -node=node1 -bootstrap-expect=1 -data-dir=/consul/data
    ports:
      - "8500:8500"
      - "8600:8600/tcp"
      - "8600:8600/udp"
      - "8300:8300"
      - "8301:8301/tcp"
      - "8301:8301/udp"
      - "8302:8302/tcp"
      - "8302:8302/udp"
    networks:
      - easy-network
    environment:
      - CONSUL_ALLOW_PRIVILEGED_PORTS=

  easy-db:
    image: postgres:18.1
    container_name: easy-db
    ports:
      - "5432:5432"
    networks:
      - easy-network
    environment:
      - POSTGRES_USER=easy
      - POSTGRES_PASSWORD=easypass
      - POSTGRES_DB=easydb
      - PGDATA=/var/lib/postgresql/data
    volumes:
      - ./postgres/data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - easy-network
    command: redis-server --appendonly yes

  loki:
    image: grafana/loki:2.9.4
    container_name: loki
    ports:
      - "3100:3100"
    networks:
      - easy-network
    volumes:
      - loki_data:/etc/loki
    command:
      - "-config.expand-env"
      - "-config.file=/etc/loki/local-config.yaml"
    environment:
      - LOKI_USERNAME=easy
      - LOKI_PASSWORD=easyms

  grafana:
    image: grafana/grafana:10.3.1
    container_name: grafana
    ports:
      - "3000:3000"
    networks:
      - easy-network
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - loki

  promtail:
    image: grafana/promtail:2.9.4
    container_name: promtail
    volumes:
      - ./promtail/config.yaml:/etc/promtail/config.yaml
      - ./promtail/log:/var/log
    command:
      - "-config.expand-env"
      - "-config.file=/etc/promtail/config.yaml"
    networks:
      - easy-network
    depends_on:
      - loki

volumes:
  loki_data:
  grafana_data: