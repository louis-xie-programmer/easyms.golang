server:
  host: "0.0.0.0"
  port: 10000
rate_limit:
  ip_limits:
    - cidr: "192.168.1.0/24"
      rate: 20
      burst: 40
    - cidr: "10.0.0.0/8"
      rate: 5
      burst: 10
  ua_limits:
    - pattern: ".*Chrome.*"
      rate: 50
      burst: 100
    - pattern: ".*curl.*"
      rate: 2
      burst: 5
  default_rate: 100
  default_burst: 200